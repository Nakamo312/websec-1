<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrapper">

    <div class="top">
        <input id="num1" type="number">

        <select id="op">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
        </select>

        <input id="num2" type="number">
    </div>

    <button id="calc">подсчитать</button>

    <div id="history">
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
